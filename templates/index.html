<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ice Cream Sales Predictor</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <main class="page-wrap">
      <section class="card shadow-lg predictor-card">
        <div class="card-body p-4 p-md-5">
          <h1 class="display-6 fw-bold mb-3">Ice Cream Sales Predictor</h1>
          <p class="text-muted mb-4">
            Enter the temperature to estimate expected ice cream sales.
          </p>

          <form action="/predict" method="post" class="row g-3">
            <div class="col-12">
              <label for="temperature" class="form-label">Temperature</label>
              <input
                type="text"
                class="form-control"
                id="temperature"
                name="temperature"
                placeholder="Example: 72.5"
                value="{{ temperature if temperature is defined else '' }}"
                required
              />
            </div>
            <div class="col-12 d-grid">
              <button type="submit" class="btn btn-primary btn-lg">
                Predict Sales
              </button>
            </div>
          </form>

          {% if error %}
          <div class="alert alert-danger mt-4 mb-0" role="alert">
            {{ error }}
          </div>
          {% endif %} {% if prediction is defined %}
          <div class="alert alert-success mt-4 mb-0" role="alert">
            Predicted ice cream sales: <strong>{{ prediction }}</strong>
          </div>
          {% endif %}
        </div>
      </section>
    </main>
  </body>
</html>
